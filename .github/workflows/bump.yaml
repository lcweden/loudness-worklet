name: Bump Version
on:
  workflow_dispatch:
    inputs:
      increment:
        description: "version increment"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.bump.outputs.branch }}
    env:
      INCREMENT: ${{ inputs.increment }}
    steps:
      - name: Validate increment
        run: |
          if [[ "$INCREMENT" != patch && "$INCREMENT" != minor && "$INCREMENT" != major ]]; then
            echo "Increment must be patch, minor or major."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and Git push
        id: bump
        run: |
          npm version "$INCREMENT" --no-git-tag-version
          VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          BRANCH_NAME="release/v$VERSION"
          git checkout -b "$BRANCH_NAME"
          git add package.json package-lock.json
          git commit -m "chore: release v$VERSION"
          git push -u origin "$BRANCH_NAME"
          printf 'version=%s\nbranch=%s\n' "$VERSION" "$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH_NAME: ${{ steps.bump.outputs.branch }}
        run: |
          gh pr create \
            --title "release/v$VERSION" \
            --body "This pull request bumps the version to v$VERSION." \
            --head "$BRANCH_NAME" \
            --base main

  validate-release:
    needs: release-pr
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ needs.release-pr.outputs.branch }}
